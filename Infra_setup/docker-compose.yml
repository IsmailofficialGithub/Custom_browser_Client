services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostrif-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hostrif}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hostrif_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hostrif}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: hostrif-backend
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hostrif}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-hostrif-super-secret-jwt-key-2026}
      GRPC_HOST: ${GRPC_HOST:-0.0.0.0}
      GRPC_PORT: ${GRPC_PORT:-50051}
      ADMIN_HTTP_PORT: ${ADMIN_HTTP_PORT:-50052}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
      - "${ADMIN_HTTP_PORT:-50052}:${ADMIN_HTTP_PORT:-50052}"

  admin:
    build:
      context: ../Admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:50052}
    container_name: hostrif-admin
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:50052}
      PORT: ${ADMIN_PORT:-3000}
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"

volumes:
  hostrif_pgdata:
    name: hostrif_pgdata

